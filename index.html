<title>BJJ Roadmap</title>
<style>
/* Layout: an iOS-style app shell. Large-title screens over inset grouped lists, a bottom tab bar, sheets that slide up.
   Wide screens show the roadmap as a flowchart: belt-coloured topics on a spine, techniques on dotted wires. */
:root {
  --bg: #f2f2f7;
  --cell: #ffffff;
  --cell-hi: #e5e5ea;
  --fill: rgba(120,120,128,.12);
  --seg-on: #ffffff;
  --label: #000000;
  --label-2: #6c6c70;
  --label-3: #a1a1a6;
  --sep: #c6c6c8;
  --tint: #0068da;
  --btn: #0068da;
  --green: #248a3d;
  --red: #d70015;
  --orange: #b25000;
  --purple: #8944ab;
  --c-blue: #007aff; --c-green: #34c759; --c-red: #ff3b30; --c-orange: #ff9500; --c-purple: #af52de; --c-teal: #30b0c7; --c-indigo: #5856d6; --c-gray: #8e8e93;
  --heat-0: rgba(120,120,128,.12); --heat-1: #c7defb; --heat-2: #8bbcf6; --heat-3: #3d8bec; --heat-4: #0a5fc8;
  --bar-bg: rgba(249,249,249,.86);
  --wire: #8aa6d6;
  --b-white: #ffffff; --b-blue: #1c4db5; --b-purple: #5a2b90; --b-brown: #6a4125; --b-black: #121212;
  --tape: #f5f5f2;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px -14px rgba(0,0,0,.3);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --nav-h: 44px;
  --tab-h: 50px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --cell: #1c1c1e; --cell-hi: #2c2c2e; --fill: rgba(118,118,128,.24); --seg-on: #636366;
    --label: #ffffff; --label-2: #98989f; --label-3: #636366; --sep: #38383a; --tint: #0a84ff; --btn: #0a6ed8;
    --green: #30d158; --red: #ff453a; --orange: #ff9f0a; --purple: #bf5af2;
    --c-blue: #0a84ff; --c-green: #30d158; --c-red: #ff453a; --c-orange: #ff9f0a; --c-purple: #bf5af2; --c-teal: #40c8e0; --c-indigo: #5e5ce6; --c-gray: #8e8e93;
    --heat-0: rgba(118,118,128,.24); --heat-1: #12345e; --heat-2: #1b5aa8; --heat-3: #2f80ee; --heat-4: #7ab6ff;
    --bar-bg: rgba(22,22,24,.82); --wire: #4a6a9c;
    --b-white: #eceff3; --b-blue: #2f63d0; --b-purple: #7646b4; --b-brown: #87542f; --b-black: #050505;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --cell: #1c1c1e; --cell-hi: #2c2c2e; --fill: rgba(118,118,128,.24); --seg-on: #636366;
  --label: #ffffff; --label-2: #98989f; --label-3: #636366; --sep: #38383a; --tint: #0a84ff; --btn: #0a6ed8;
  --green: #30d158; --red: #ff453a; --orange: #ff9f0a; --purple: #bf5af2;
  --c-blue: #0a84ff; --c-green: #30d158; --c-red: #ff453a; --c-orange: #ff9f0a; --c-purple: #bf5af2; --c-teal: #40c8e0; --c-indigo: #5e5ce6; --c-gray: #8e8e93;
  --heat-0: rgba(118,118,128,.24); --heat-1: #12345e; --heat-2: #1b5aa8; --heat-3: #2f80ee; --heat-4: #7ab6ff;
  --bar-bg: rgba(22,22,24,.82); --wire: #4a6a9c;
  --b-white: #eceff3; --b-blue: #2f63d0; --b-purple: #7646b4; --b-brown: #87542f; --b-black: #050505;
  --shadow: 0 10px 30px -12px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--label); font: 400 17px/1.29 var(--font); letter-spacing: -.41px; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
html.has-sheet body { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; border-radius: 6px; }
a { color: var(--tint); text-decoration: none; }
svg { display: block; }

/* ---------- screens, nav bars, large titles ---------- */
.screen { padding-top: calc(var(--nav-h) + env(safe-area-inset-top, 0px)); padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 40px); min-height: 100vh; }
.content { max-width: 720px; margin: 0 auto; }
.content.wide { max-width: 1160px; }
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; padding-top: env(safe-area-inset-top, 0px); background: transparent; transition: background .2s, box-shadow .2s; }
.navbar.compact { background: var(--bar-bg); box-shadow: 0 .5px 0 var(--sep); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
.nav-inner { height: var(--nav-h); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-inline: 8px; max-width: 720px; margin: 0 auto; }
.nav-title { margin: 0; font-size: 17px; font-weight: 600; opacity: 0; transition: opacity .2s; }
.navbar.compact .nav-title { opacity: 1; }
.nav-side { display: flex; align-items: center; gap: 4px; }
.nav-side.right { justify-content: flex-end; }
.nav-btn { color: var(--tint); font-size: 17px; padding: 10px 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; }
.nav-btn.strong { font-weight: 600; }
.nav-btn:disabled { color: var(--label-3); cursor: default; }
.nav-btn svg { width: 24px; height: 24px; }
.large-title { margin: 2px 0 10px; padding-inline: 16px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .37px; }
.screen[hidden] { display: none; }

/* ---------- grouped lists ---------- */
.group { margin: 0 16px 0; background: var(--cell); border-radius: 10px; overflow: hidden; }
.group + .group, .pad + .group, .group + .pad { margin-top: 20px; }
.group-header { margin: 26px 16px 7px; padding-inline: 16px; font-size: 13px; line-height: 18px; color: var(--label-2); letter-spacing: -.08px; display: flex; justify-content: space-between; gap: 12px; }
.group-footer { margin: 7px 16px 0; padding-inline: 16px; font-size: 13px; line-height: 18px; color: var(--label-2); letter-spacing: -.08px; }
.pad { margin-inline: 16px; }
.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 16px; width: 100%; text-align: left; }
.row + .row::before, .row + .row-edit::before, .row-edit + .row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); height: .5px; background: var(--sep); }
button.row:active, .row button.row-main:active { background: var(--cell-hi); }
.row-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; align-self: stretch; margin: -10px -16px -10px 0; padding: 10px 16px 10px 0; text-align: left; }
.rt { display: block; font-size: 17px; line-height: 22px; }
.rs { display: block; font-size: 13px; line-height: 18px; color: var(--label-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rtext { flex: 1; min-width: 0; }
.rv { color: var(--label-2); font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { color: var(--label-3); flex: none; }
.row.link .rt { color: var(--tint); }
.row.danger .rt { color: var(--red); }
.cell-text { padding: 12px 16px; font-size: 17px; line-height: 23px; }
.cell-text small { display: block; font-size: 13px; color: var(--label-2); margin-bottom: 2px; }
.empty { padding: 28px 20px; text-align: center; color: var(--label-2); font-size: 15px; line-height: 21px; }
.empty b { display: block; color: var(--label); font-size: 20px; line-height: 25px; font-weight: 600; margin-bottom: 6px; }

/* ---------- controls ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { border-radius: 7px; padding: 6px 4px; font-size: 13px; font-weight: 500; line-height: 18px; letter-spacing: -.08px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .2s, box-shadow .2s; }
.seg button[aria-pressed="true"] { background: var(--seg-on); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }
.search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px; height: 36px; padding-inline: 8px; margin-inline: 16px; color: var(--label-2); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 17px; color: var(--label); height: 100%; }
.search input::placeholder { color: var(--label-2); }
.stepper { display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--fill); border-radius: 8px; height: 32px; width: 94px; flex: none; }
.stepper button { font-size: 22px; font-weight: 400; line-height: 1; display: grid; place-items: center; }
.stepper button + button { box-shadow: inset .5px 0 0 var(--sep); }
.stepper button:active { background: var(--cell-hi); border-radius: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 50px; border-radius: 12px; padding: 0 18px; font-size: 17px; font-weight: 600; }
.btn.filled { background: var(--btn); color: #fff; }
.btn.tinted { background: color-mix(in srgb, var(--tint) 15%, transparent); color: var(--tint); }
.btn.small { min-height: 36px; font-size: 15px; border-radius: 10px; padding: 0 12px; }
.btn:active { opacity: .7; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { width: 100%; border: 0; background: transparent; outline: none; resize: none; padding: 12px 16px; font-size: 17px; line-height: 23px; color: var(--label); display: block; }
.field::placeholder { color: var(--label-2); }
.date-input { border: 0; background: var(--fill); border-radius: 7px; padding: 6px 10px; font-size: 17px; color: var(--label); }

/* ---------- belt graphic ---------- */
.belt-gfx { position: relative; display: block; height: 22px; border-radius: 3px; background: var(--belt); border: 1px solid rgba(0,0,0,.18); flex: none; }
.belt-gfx[data-belt="white"] { border-color: var(--label-3); }
.belt-gfx .bar { position: absolute; right: 12%; top: -1px; bottom: -1px; width: 34%; background: var(--rank, #111); display: flex; justify-content: flex-end; gap: 4px; padding-inline: 6px; }
.belt-gfx .bar i { width: 5px; background: rgba(255,255,255,.16); transition: background .3s; }
.belt-gfx .bar i.on { background: var(--tape); }
.belt-gfx.sm { width: 46px; height: 12px; border-radius: 2px; }
.belt-gfx.sm .bar { gap: 2px; padding-inline: 2px; }
.belt-gfx.sm .bar i { width: 2.5px; }
[data-belt="white"]  { --belt: var(--b-white);  --on-belt: #131a23; --rank: #111; }
[data-belt="blue"]   { --belt: var(--b-blue);   --rank: #111; }
[data-belt="purple"] { --belt: var(--b-purple); --rank: #111; }
[data-belt="brown"]  { --belt: var(--b-brown);  --rank: #111; }
[data-belt="black"]  { --belt: var(--b-black);  --rank: #c1271f; }

/* ---------- roadmap ---------- */
.belt-card { padding: 16px; display: grid; gap: 12px; }
.belt-card .belt-gfx { height: 26px; }
.belt-card h3 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: .35px; }
.belt-card p { margin: 2px 0 0; color: var(--label-2); font-size: 15px; line-height: 20px; }
.belt-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--label-2); }
.belt-meta b { color: var(--label); font-weight: 600; font-variant-numeric: tabular-nums; }
.topic-head { display: flex; align-items: center; gap: 10px; width: calc(100% - 32px); margin: 28px 16px 8px; padding: 2px 16px; text-align: left; }
.topic-head .tt { flex: 1; font-size: 20px; line-height: 25px; font-weight: 600; letter-spacing: .38px; }
.topic-head .tc { font-size: 15px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.topic-head .belt-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--belt); box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); flex: none; }
.node-row { --inset: 58px; padding-left: 8px; gap: 6px; }
.status { width: 44px; height: 44px; margin: -10px 0; display: grid; place-items: center; flex: none; }
.status .dot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--label-3); display: grid; place-items: center; transition: background .2s, border-color .2s; }
.status[data-status="learning"] .dot { border-color: var(--c-orange); background: linear-gradient(90deg, var(--c-orange) 50%, transparent 50%); }
.status[data-status="done"] .dot { border-color: var(--c-green); background: var(--c-green); }
.status[data-status="done"] .dot::after { content: ""; width: 10px; height: 5px; border: solid #fff; border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
.status[data-status="skip"] .dot { border-style: dashed; }
.node-row[data-status="skip"] .rt { color: var(--label-2); text-decoration: line-through; }
.badge-class { color: var(--orange); }
.count { font-size: 15px; color: var(--label-2); font-variant-numeric: tabular-nums; }

/* flowchart (wide screens) */
.flow { position: relative; padding-block: 18px 8px; margin-top: 8px; }
.flow::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--label); opacity: .8; }
.flow-row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 290px) minmax(0, 1fr); column-gap: 76px; align-items: center; padding-block: 24px; }
.flow-col { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.flow-col.left { align-items: flex-end; }
.flow-col.right { align-items: flex-start; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.wires path { fill: none; stroke: var(--wire); stroke-width: 1.6; stroke-dasharray: 2 4; stroke-linecap: round; }
.flow-topic { position: relative; width: 100%; background: var(--belt); color: var(--on-belt, #fff); border: 2px solid var(--label); border-radius: 8px; padding: 14px 70px 14px 16px; box-shadow: var(--shadow); font-weight: 700; font-size: 17px; line-height: 22px; transition: transform .15s; }
.flow-topic::after { content: ""; position: absolute; right: 16px; top: 0; bottom: 0; width: 30px; background: var(--rank, #111); }
.flow-topic:hover { transform: translateY(-2px); }
.flow-kid { width: 100%; max-width: 250px; display: flex; align-items: baseline; gap: 8px; background: var(--cell); border: 1.5px solid var(--label-3); border-radius: 8px; padding: 8px 12px; font-size: 15px; line-height: 20px; font-weight: 600; transition: border-color .15s; }
.flow-kid:hover { border-color: var(--label); }
.flow-kid.opt { border-style: dashed; font-weight: 400; }
.flow-kid .lbl { flex: 1; min-width: 0; }
.flow-kid .gi, .flow-kid .n { font-family: var(--mono); font-size: 11px; color: var(--label-2); font-weight: 500; }
.flow-kid[data-status="done"] { background: color-mix(in srgb, var(--c-green) 16%, var(--cell)); border-color: var(--c-green); }
.flow-kid[data-status="learning"] { background: color-mix(in srgb, var(--c-orange) 16%, var(--cell)); border-color: var(--c-orange); }
.flow-kid[data-status="skip"] { opacity: .45; }
.flow-kid[data-status="skip"] .lbl { text-decoration: line-through; }
.flow-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 18px 16px 0; font-size: 13px; color: var(--label-2); }
.flow-legend span { display: inline-flex; align-items: center; gap: 6px; }
.flow-legend i { width: 22px; height: 12px; border-radius: 3px; border: 1.5px solid var(--label-3); background: var(--cell); }
.flow-legend i.opt { border-style: dashed; }
.flow-legend i.done { border-color: var(--c-green); background: color-mix(in srgb, var(--c-green) 16%, var(--cell)); }
.flow-legend i.learn { border-color: var(--c-orange); background: color-mix(in srgb, var(--c-orange) 16%, var(--cell)); }

/* ---------- log ---------- */
.kind-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--kc, var(--c-gray)); }
.k-hit { --kc: var(--c-green); } .k-caught { --kc: var(--c-red); } .k-escape { --kc: var(--c-teal); } .k-drill { --kc: var(--c-purple); } .k-class { --kc: var(--c-orange); }
.log-input { position: relative; }
.log-input .field { min-height: 132px; padding-right: 54px; }
.mic { position: absolute; right: 8px; bottom: 8px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--tint); background: var(--fill); }
.mic.on { background: var(--c-red); color: #fff; }
.row-edit { position: relative; padding: 8px 16px 14px; display: grid; gap: 10px; background: var(--cell); }
.row-edit .edit-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; }
.row-edit .edit-actions { display: flex; gap: 8px; }
.unmatched .rt { color: var(--label-2); font-style: italic; }
.said { margin: 0; padding: 12px 16px; font-size: 15px; line-height: 21px; color: var(--label-2); }
.said + .said { box-shadow: inset 0 .5px 0 var(--sep); }

/* ---------- journal ---------- */
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); padding: 14px 0; }
.stats3 > div { padding-inline: 16px; display: grid; gap: 2px; }
.stats3 > div + div { box-shadow: inset .5px 0 0 var(--sep); }
.stats3 small, .tile small { font-size: 13px; color: var(--label-2); }
.stats3 b { font-size: 22px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .35px; }
.date-box { width: 44px; flex: none; text-align: center; display: grid; line-height: 1.1; }
.date-box small { font-size: 12px; color: var(--red); font-weight: 600; }
.date-box b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.session-row .rs.totd { color: var(--orange); }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; font-size: 15px; }

/* ---------- insights ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-inline: 16px; }
.tile { background: var(--cell); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.tile b { font-size: 28px; line-height: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .36px; }
.tile b span { font-size: 17px; font-weight: 600; color: var(--label-2); margin-left: 2px; }
.tile .sub { font-size: 13px; color: var(--label-2); }
.heat-card { padding: 14px 16px 12px; position: relative; }
.heat { display: grid; grid-template-columns: 16px repeat(18, minmax(0, 1fr)); gap: 3px; }
.heat .m { font-size: 11px; color: var(--label-2); white-space: nowrap; height: 14px; overflow: visible; }
.heat .d { font-size: 10px; color: var(--label-2); line-height: 1; align-self: center; }
.heat .c { aspect-ratio: 1; border-radius: 3px; background: var(--heat-0); }
.heat .c[data-l="1"] { background: var(--heat-1); } .heat .c[data-l="2"] { background: var(--heat-2); } .heat .c[data-l="3"] { background: var(--heat-3); } .heat .c[data-l="4"] { background: var(--heat-4); }
.heat .c.future { background: transparent; }
.heat .c.today { box-shadow: inset 0 0 0 1.5px var(--label); }
.heat-legend { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: var(--label-2); }
.heat-legend .scale { display: flex; align-items: center; gap: 3px; }
.heat-legend .scale i { width: 10px; height: 10px; border-radius: 2px; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--label); color: var(--cell); font-size: 13px; line-height: 18px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); }
.ins-icon { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: #fff; flex: none; background: var(--ic, var(--c-gray)); align-self: flex-start; margin-top: 2px; }
.ins-icon svg { width: 18px; height: 18px; }
.ins .rt { font-weight: 600; }
.ins .rs { white-space: normal; font-size: 15px; line-height: 20px; }
.bars .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; }
.bars .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.bars .bar i { display: block; height: 100%; border-radius: 3px; background: var(--bc, var(--c-blue)); }
.bars .rt { font-size: 15px; }
.bars .rv { font-size: 15px; }
.belt-row .belt-gfx { width: 84px; }

/* ---------- tab bar ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--bar-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 -.5px 0 var(--sep); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-inner { height: var(--tab-h); display: grid; grid-template-columns: repeat(4, 1fr); max-width: 560px; margin: 0 auto; }
.tab { display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--label-2); font-size: 10px; font-weight: 500; letter-spacing: .1px; }
.tab svg { width: 26px; height: 26px; }
